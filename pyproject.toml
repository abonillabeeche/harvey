[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harvey"
version = "0.1.0"
description = "DR orchestration CLI for KubeVirt / SUSE Virtualization"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = [
  "disaster-recovery",
  "kubevirt",
  "harvester",
  "suse-virtualization",
  "kubernetes",
  "rancher",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer[all]>=0.9.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "typing_extensions>=4.9.0",
]

[project.scripts]
harvey = "harvey.cli:app"

[project.urls]
Homepage    = "https://github.com/abonillabeeche/harvey"
Issues      = "https://github.com/abonillabeeche/harvey/issues"
Releases    = "https://github.com/abonillabeeche/harvey/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/harvey"]
