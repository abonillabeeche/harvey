# Apply the Secret + BackupTarget on BOTH clusters: same name, same URL, working credentials.
# Harvester's own backup target (Longhorn's `default`) is left alone. See ../../docs/longhorn.md
apiVersion: v1
kind: Secret
metadata: {name: harvey-backup-target-secret, namespace: longhorn-system}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "..."
  AWS_SECRET_ACCESS_KEY: "..."
  AWS_ENDPOINTS: "https://s3.example.com"      # omit for AWS S3
---
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata: {name: harvey, namespace: longhorn-system}
spec:
  backupTargetURL: s3://harvey-dr@us-east-1/
  credentialSecret: harvey-backup-target-secret
  pollInterval: 30s
---
# Source cluster only. Use a CDI-backed image: Harvester's default (backing image) images tie V1 disks to a
# cluster-local backing image name that the DR cluster won't have.
apiVersion: harvesterhci.io/v1beta1
kind: VirtualMachineImage
metadata:
  name: leap16
  namespace: production
spec:
  backend: cdi
  displayName: leap16
  sourceType: download
  targetStorageClassName: longhorn
  url: https://download.opensuse.org/repositories/openSUSE:/Leap:/16.0:/Images/images/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2
